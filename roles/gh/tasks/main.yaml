---
- name: Setup github-cli repo
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg

- name: Install github-cli
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

