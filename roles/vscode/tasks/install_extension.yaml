---
- name: Check extension "{{ extension }}" installed
  ansible.builtin.shell: code --list-extensions | grep -q "{{ extension }}"
  register: extension_installed
  changed_when: false
  failed_when: false

- name: Install extension "{{ extension }}"
  ansible.builtin.command: code --install-extension "{{ extension }}"
  when: extension_installed.rc != 0
