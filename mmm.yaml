---
- name: Initial setup
  hosts: local
  tags: init_setup
  roles:
    - role: init
      tags: init
    - role: apt
      tags: apt
      vars:
        packages: "{{ apt.standalone_packages }}"
    - role: user
      tags: user

- name: System setup
  hosts: local
  tags: system_setup
  roles:
    - role: nvidia
      tags: nvidia
    - role: gnome
      tags: gnome
      vars:
        settings: "{{ gnome.settings }}"

- name: Software setup
  hosts: local
  tags: software_setup
  roles:
    - role: vscode
      tags: vscode
      vars:
        extensions: "{{ vscode.extensions }}"
    - role: google-chrome
      tags: google-chrome
    - role: docker
      tags: docker
      vars:
        codename: "{{ ansible_facts.distribution_release }}"
        user: "{{ ansible_facts.user_id }}"
    - role: git
      tags: git
      vars:
        user: "{{ ansible_facts.user_id }}"
        home: "{{ ansible_facts.user_dir }}"
        repos_dir: "{{ git.repos_dir }}"
        mmm_repo: "{{ git.mmm_repo }}"
        system_user_name: "{{ git.system.user.name }}"
        system_user_email: "{{ git.system.user.email }}"
        global_user_name: "{{ git.global.user.name }}"
        global_user_email: "{{ git.global.user.email }}"
