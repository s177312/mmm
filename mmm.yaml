---
- name: Initial setup
  hosts: local
  become: true
  roles:
    - role: init
    - role: apt
      vars:
        initial_upgrade_file: "{{ apt.intial_upgrade_file }}"
        packages: "{{ apt.standalone_packages }}"
    - role: user

- name: System setup
  hosts: local
  become: true
  roles:
    - role: nvidia

- name: Programs setup
  hosts: local
  become: true
  roles:
    - role: vscode
      vars:
        extensions: "{{ vscode.extensions }}"
